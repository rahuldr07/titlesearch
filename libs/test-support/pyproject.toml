[project]
name = "titlepipe-test-support"
version = "0.1.0"
description = "Deterministic test doubles shared by TitlePipe test suites."
requires-python = ">=3.13,<3.14"
dependencies = ["titlepipe-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.15.*",
    "pyright==1.1.*",
    "pytest==9.1.*",
    "pytest-cov==7.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlepipe_test_support"]

[tool.uv.sources]
titlepipe-domain = { path = "../domain", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

# Test doubles only. This package must never contain production secrets, real
# client data, county packages or seed fixtures.

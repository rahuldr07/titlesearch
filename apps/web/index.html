    <title>TitlePipe</title>
    <!--
      The three typefaces are semantic: Plus Jakarta Sans is the interface,
      JetBrains Mono is data only (refs, money, citations, hashes, kbd), and
      Source Serif 4 is paper — evidence scans render as stock. They ship as
      bundled variable woff2 (imported in src/main.tsx): a Google Fonts link
      here failed silently behind restrictive proxies, leaving the app in
      system fallbacks. No <link> here on purpose.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

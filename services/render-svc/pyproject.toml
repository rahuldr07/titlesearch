[project]
name = "titlepipe-render-svc"
version = "0.1.0"
description = "TitlePipe render worker — DOCX generation, PDF conversion, report versioning."
requires-python = ">=3.13,<3.14"
dependencies = [
    "titlepipe-domain",
    "pydantic==2.13.*",
    "pydantic-settings==2.14.*",
    "structlog>=26.1,<27",
]

# Gate 1 is the worker shell. docxtpl, python-docx, pikepdf, boto3 and httpx
# land at Gate 8 with the code that uses them. Gotenberg is never a Python
# dependency — it is a pinned, network-restricted container declared in
# infra/compose.

[project.scripts]
titlepipe-render = "titlepipe_render.cli:run"

[dependency-groups]
dev = [
    "ruff==0.15.*",
    "pyright==1.1.*",
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.*",
    "titlepipe-test-support",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titlepipe_render"]

[tool.uv.sources]
titlepipe-domain = { path = "../../libs/domain", editable = true }
titlepipe-test-support = { path = "../../libs/test-support", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = false

# Alembic configuration for core-api.
#
# THERE IS NO `sqlalchemy.url` IN THIS FILE, deliberately. A DSN here would be a
# credential in version control, and the one Alembic needs is
# `titlepipe_migration`'s — the role that can become the owner of every table.
# `migrations/env.py` resolves the URL at run time; see its `_database_url` for
# the three places it looks and the order it looks in.
#
# `%(here)s` is the directory holding THIS file, which Alembic defines for
# exactly this purpose. `script_location = migrations` alone is resolved against
# the process's cwd, and this suite is run from the repository root as often as
# from `services/core-api/`.

[alembic]
script_location = %(here)s/migrations

# Revision ids are written by hand — `0001`, `0002`, … — so that `0002`'s
# `down_revision = "0001"` is a literal somebody can read rather than a hash
# that has to be looked up. The template below puts that id at the FRONT of the
# file name, so the directory listing is in chain order.
#
# THIS COMMENT USED TO SAY "The date prefix keeps the FILES in chronological
# order without touching the ids." There is no date prefix. `file_template` has
# no `%%(year)s`/`%%(month)s`/`%%(day)s` component and never has had one, and
# neither file on disk carries a date — `0001_skeleton.py` and
# `0002_forced_rls_and_grants.py`. The ordering it describes is real and comes
# from the zero-padded id, which is the same thing the ids are for; the
# mechanism named was a default from Alembic's own sample ini that this file
# does not use.
file_template = %%(rev)s_%%(slug)s

# The migration runs as `titlepipe_migration` and immediately issues `SET ROLE
# titlepipe_owner`, which is CONNECTION-scoped. A `SET LOCAL` or a `RESET ROLE`
# would leave `alembic current`, `stamp` and `downgrade` unable to read
# `alembic_version` — the table belongs to the owner, and the error is
# `permission denied for table alembic_version`, not for the schema.
# `transaction_per_migration` is left at its default (false) for the same
# reason: one transaction around the whole upgrade, one role for its duration.


# Logging. These sections are read ONLY when the `alembic` console script is the
# entry point.
#
# THE PREVIOUS VERSION OF THIS COMMENT SAID THE OPPOSITE OF THE TRUTH. It claimed
# `env.py` called `fileConfig` "only when a config file is present, so a
# programmatically built `Config` (which is how the tests drive this) does not
# need these sections". `tests/conftest.py::_alembic_config` builds its `Config`
# FROM THIS FILE — `Config(str(ALEMBIC_INI))` — so `config_file_name` is set on
# every programmatic call and `fileConfig` ran on all of them, tearing down the
# root logger's handlers each time.
#
# THE COUNT IN THIS COMMENT WAS "sixteen times per suite run" AND IS NOW
# MEASURED. That number was the count of `command.*` CALL SITES in
# `tests/test_schema_migration.py`, which is neither the whole suite's call
# sites (24, across four files) nor the number of times `env.py` actually runs
# (fixtures repeat it per module). RE-MEASURED 2026-08-06 by counting entries to
# `env.py`'s gate over one full `uv run pytest` of this service:
#
#     env.py reached                      30
#       of those, cmd_opts is None        29   <- programmatic; the old gate fired
#       of those, cmd_opts is set          1   <- the `alembic` CLI test
#
# So it was 29 per suite run, not sixteen.
#
# `env.py` now gates the call on `config.cmd_opts is not None`, which Alembic
# sets only in `CommandLine.main`. A programmatically built `Config` genuinely
# does not reach these sections now — because of that gate, not because of the
# file name.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Alembic configuration for core-api.
#
# THERE IS NO `sqlalchemy.url` IN THIS FILE, deliberately. A DSN here would be a
# credential in version control, and the one Alembic needs is
# `titlepipe_migration`'s — the role that can become the owner of every table.
# `migrations/env.py` resolves the URL at run time; see its `_database_url` for
# the three places it looks and the order it looks in.
#
# `%(here)s` is the directory holding THIS file, which Alembic defines for
# exactly this purpose. `script_location = migrations` alone is resolved against
# the process's cwd, and this suite is run from the repository root as often as
# from `services/core-api/`.

[alembic]
script_location = %(here)s/migrations

# Revision ids are written by hand — `0001`, `0002`, … — so that Task 4's
# `down_revision = "0001"` is a literal somebody can read rather than a hash
# that has to be looked up. The date prefix keeps the FILES in chronological
# order without touching the ids.
file_template = %%(rev)s_%%(slug)s

# The migration runs as `titlepipe_migration` and immediately issues `SET ROLE
# titlepipe_owner`, which is CONNECTION-scoped. A `SET LOCAL` or a `RESET ROLE`
# would leave `alembic current`, `stamp` and `downgrade` unable to read
# `alembic_version` — the table belongs to the owner, and the error is
# `permission denied for table alembic_version`, not for the schema.
# `transaction_per_migration` is left at its default (false) for the same
# reason: one transaction around the whole upgrade, one role for its duration.


# Logging. `env.py` calls `fileConfig` only when a config file is present, so a
# programmatically built `Config` (which is how the tests drive this) does not
# need these sections.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "titlepipe-blind-svc"
version = "0.1.0"
description = "TitlePipe Blind API — blind assignment and entry capture only."
requires-python = ">=3.13,<3.14"
dependencies = [
    "titlepipe-domain",
    "fastapi==0.139.*",
    "uvicorn[standard]==0.51.*",
    "pydantic==2.13.*",
    "pydantic-settings==2.14.*",
    "structlog>=26.1,<27",
]

# This service must never depend on titlepipe-core-api, titlepipe-extraction-svc
# or titlepipe-render-svc. Its isolation is topological — separate deployment,
# separate database, separate object-store credentials — and a shared package
# would be the first crack in it. tests/test_blind_boundary.py enforces this;
# this comment named a tests/test_boundaries.py that has never existed.

[dependency-groups]
dev = [
    "ruff==0.15.*",
    "pyright==1.1.*",
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.*",
    "httpx2>=2,<3",
    "titlepipe-test-support",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titlepipe_blind"]

[tool.uv.sources]
titlepipe-domain = { path = "../../libs/domain", editable = true }
titlepipe-test-support = { path = "../../libs/test-support", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = false

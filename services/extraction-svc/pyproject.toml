[project]
name = "titlepipe-extraction-svc"
version = "0.1.0"
description = "TitlePipe extraction worker — validation, segmentation, extraction, assembly, routing."
requires-python = ">=3.13,<3.14"
dependencies = [
    "titlepipe-domain",
    "pydantic==2.13.*",
    "pydantic-settings==2.14.*",
    "structlog>=26.1,<27",
]

# Gate 1 is the worker shell. pikepdf, pypdfium2, pdfplumber, pillow and the
# provider SDKs land at Gate 5/7 with the code that uses them — this service
# has the heaviest native dependency set of the four, and pulling it in before
# it is needed makes every earlier CI run slower and every image larger.
# PaddleOCR in particular only ever enters the environment that needs its
# native stack. No LangChain, no PyMuPDF.

[project.scripts]
titlepipe-extraction = "titlepipe_extraction.cli:run"

[dependency-groups]
dev = [
    "ruff==0.15.*",
    "pyright==1.1.*",
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.*",
    "titlepipe-test-support",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titlepipe_extraction"]

[tool.uv.sources]
titlepipe-domain = { path = "../../libs/domain", editable = true }
titlepipe-test-support = { path = "../../libs/test-support", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = false

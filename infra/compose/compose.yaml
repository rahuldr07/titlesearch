# Gate 1 compose: build and run the four service shells, nothing more.
#
#   docker compose -f infra/compose/compose.yaml build
#   docker compose -f infra/compose/compose.yaml up -d core-api blind-api
#   docker compose -f infra/compose/compose.yaml run --rm extraction-worker check
#
# No PostgreSQL here. The database arrives at Gate 2 together with the roles,
# the forced RLS policies and the tenant-context lifecycle; standing one up now
# would invite a service to connect to it before any of that exists.
#
# No Gotenberg here either. It arrives at Gate 8, pinned by digest and on an
# internal-only network.

name: titlepipe

services:
  core-api:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.core-api
    image: titlepipe/core-api:dev
    environment:
      # Required — the settings model has no default, deliberately.
      TITLEPIPE_ENVIRONMENT: development
      TITLEPIPE_HOST: 0.0.0.0
      TITLEPIPE_PORT: "8000"
      TITLEPIPE_LOG_RENDERER: json
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core

  blind-api:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.blind-svc
    image: titlepipe/blind-svc:dev
    environment:
      TITLEPIPE_BLIND_ENVIRONMENT: development
      TITLEPIPE_BLIND_HOST: 0.0.0.0
      TITLEPIPE_BLIND_PORT: "8100"
      TITLEPIPE_BLIND_LOG_RENDERER: json
    ports:
      - "8100:8100"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Deliberately on its own network with no route to `core`. The blind
    # service's isolation is topological; this file is where that starts being
    # true locally, so a developer cannot accidentally build against a
    # reachable Core database.
    networks:
      - blind

  extraction-worker:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.extraction-svc
    image: titlepipe/extraction-svc:dev
    environment:
      TITLEPIPE_EXTRACTION_ENVIRONMENT: development
      TITLEPIPE_EXTRACTION_LOG_RENDERER: json
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core
    # `run` exits non-zero until the queue exists (Gate 5). Restarting a
    # deliberately unimplemented loop would just be a crash loop, so it does
    # not restart; use `run --rm extraction-worker check` at this gate.
    restart: "no"

  render-worker:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.render-svc
    image: titlepipe/render-svc:dev
    environment:
      TITLEPIPE_RENDER_ENVIRONMENT: development
      TITLEPIPE_RENDER_LOG_RENDERER: json
      TITLEPIPE_RENDER_GOTENBERG_URL: http://gotenberg:3000
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core
    restart: "no"

networks:
  core:
    driver: bridge
  blind:
    driver: bridge

# Gate 1 compose: build and run the four service shells, nothing more.
#
#   docker compose -f infra/compose/compose.yaml build
#   docker compose -f infra/compose/compose.yaml up -d core-api blind-api
#   docker compose -f infra/compose/compose.yaml run --rm extraction-worker check
#
# No PostgreSQL here, and that is still true — but the reason has narrowed, so
# read the current one rather than the original.
#
# This used to say the database "arrives at Gate 2 together with the roles, the
# forced RLS policies and the tenant-context lifecycle; standing one up now
# would invite a service to connect to it before any of that exists." Two of
# those three have since landed — `migrations/sql/roles.sql` and
# `migrations/versions/0002_forced_rls_and_grants.py` — so the objection no
# longer covers a database as such. What it still covers is wiring one to THESE
# containers: a DSN per service, `depends_on: service_healthy`, and the
# tenant-context lifecycle, which is not written yet.
#
# The local development database therefore lives in its own file,
# `compose.db.yaml`, with its own compose project name so neither `down` reaches
# the other's containers or volumes. It serves the HOST-run loop — `uv run
# uvicorn`, `alembic upgrade head`, the rulebook seed — which is what a developer
# actually needs and what `.github/workflows/migration-harness.yml` stands up in
# CI. Start it with `scripts/dev-db.sh`; the runbook is
# `docs/backend/RUNNING-LOCALLY.md`.
#
# No Gotenberg here either. It arrives at Gate 8, pinned by digest and on an
# internal-only network.

name: titlepipe

services:
  core-api:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.core-api
    image: titlepipe/core-api:dev
    environment:
      # Required — the settings model has no default, deliberately.
      TITLEPIPE_ENVIRONMENT: development
      TITLEPIPE_HOST: 0.0.0.0
      TITLEPIPE_PORT: "8000"
      TITLEPIPE_LOG_RENDERER: json
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core

  blind-api:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.blind-svc
    image: titlepipe/blind-svc:dev
    environment:
      TITLEPIPE_BLIND_ENVIRONMENT: development
      TITLEPIPE_BLIND_HOST: 0.0.0.0
      TITLEPIPE_BLIND_PORT: "8100"
      TITLEPIPE_BLIND_LOG_RENDERER: json
    ports:
      - "8100:8100"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Deliberately on its own network with no route to `core`. The blind
    # service's isolation is topological; this file is where that starts being
    # true locally, so a developer cannot accidentally build against a
    # reachable Core database.
    networks:
      - blind

  extraction-worker:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.extraction-svc
    image: titlepipe/extraction-svc:dev
    environment:
      TITLEPIPE_EXTRACTION_ENVIRONMENT: development
      TITLEPIPE_EXTRACTION_LOG_RENDERER: json
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core
    # `run` exits non-zero until the queue exists (Gate 5). Restarting a
    # deliberately unimplemented loop would just be a crash loop, so it does
    # not restart; use `run --rm extraction-worker check` at this gate.
    restart: "no"

  render-worker:
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile.render-svc
    image: titlepipe/render-svc:dev
    environment:
      TITLEPIPE_RENDER_ENVIRONMENT: development
      TITLEPIPE_RENDER_LOG_RENDERER: json
      TITLEPIPE_RENDER_GOTENBERG_URL: http://gotenberg:3000
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - core
    restart: "no"

networks:
  core:
    driver: bridge
  blind:
    driver: bridge
